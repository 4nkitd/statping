name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            suffix: darwin-amd64
          - goarch: arm64
            suffix: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w" -o statping-${{ matrix.suffix }} ./cmd/statping
      - uses: actions/upload-artifact@v4
        with:
          name: statping-${{ matrix.suffix }}
          path: statping-${{ matrix.suffix }}

  build-linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev
      - name: Build amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w" -o statping-linux-amd64 ./cmd/statping
      - uses: actions/upload-artifact@v4
        with:
          name: statping-linux-amd64
          path: statping-linux-amd64

  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w -H windowsgui" -o statping-windows-amd64.exe ./cmd/statping
      - uses: actions/upload-artifact@v4
        with:
          name: statping-windows-amd64
          path: statping-windows-amd64.exe

  release:
    name: Create Release & Update Formula
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Package assets
        run: |
          mkdir -p release
          for dir in ./artifacts/*/; do
            cp "$dir"* ./release/ 2>/dev/null || true
          done
          cd release
          for f in statping-darwin-* statping-linux-*; do
            if [ -f "$f" ] && [[ "$f" != *.tar.gz ]]; then
              chmod +x "$f"
              tar -czf "${f}.tar.gz" "$f"
            fi
          done
          for f in statping-windows-*.exe; do
            [ -f "$f" ] && zip "${f%.exe}.zip" "$f" || true
          done
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.tar.gz
            release/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate Homebrew formula from published assets
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          DARWIN_ARM64_SHA=$(sha256sum release/statping-darwin-arm64.tar.gz | cut -d' ' -f1)
          DARWIN_AMD64_SHA=$(sha256sum release/statping-darwin-amd64.tar.gz | cut -d' ' -f1)
          LINUX_AMD64_SHA=$(sha256sum release/statping-linux-amd64.tar.gz | cut -d' ' -f1)

          cat > Formula/statping.rb <<EOF
          class Statping < Formula
            desc "Beautiful terminal-based website monitoring tool with notifications"
            homepage "https://github.com/4nkitd/statping"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/4nkitd/statping/releases/download/v#{version}/statping-darwin-arm64.tar.gz"
                sha256 "${DARWIN_ARM64_SHA}"
              else
                url "https://github.com/4nkitd/statping/releases/download/v#{version}/statping-darwin-amd64.tar.gz"
                sha256 "${DARWIN_AMD64_SHA}"
              end
            end

            on_linux do
              url "https://github.com/4nkitd/statping/releases/download/v#{version}/statping-linux-amd64.tar.gz"
              sha256 "${LINUX_AMD64_SHA}"
            end

            def install
              bin.install Dir["statping-*"].first => "statping"
            end

            def caveats
              <<~CAVEATS
                To start statping in the system tray:
                  statping tray

                To run the TUI dashboard:
                  statping start

                To enable auto-start on login:
                  statping enable
              CAVEATS
            end

            test do
              assert_match "statping", shell_output("#{bin}/statping --help")
            end
          end
          EOF

      - name: Commit updated formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/statping.rb
          git commit -m "chore: update Homebrew formula for ${GITHUB_REF#refs/tags/}" || echo "No changes to commit"
          git push origin HEAD:master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
